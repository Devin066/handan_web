scalar DateTime
scalar Decimal
scalar JSON

schema {
  query: RootQueryType
  mutation: RootMutationType
}

type Company {
  uuid: ID
  name: String
  description: String
  insertedAt: DateTime
  updatedAt: DateTime
}

type User {
  uuid: ID
  email: String
  nickname: String
  bio: String
  avatarUrl: String
  role: String
  accessToken: String
  insertedAt: DateTime
  updatedAt: DateTime
}

type Staff {
  uuid: ID
  email: String
  name: String
  phone: String
  position: String
  "regular, probationary, contractual or part_time."
  employmentType: String
  shift: String
  hiredAt: DateTime
  "active or inactive. Inactive members stay on past records but can't be assigned new work."
  status: String
  "True when this member has an account they can sign in with."
  hasLogin: Boolean
  "The login account's role, when there is one."
  role: String
  "Hourly rate used by payroll."
  baseRate: Decimal
  user: User
  company: Company
  insertedAt: DateTime
  updatedAt: DateTime
}

type Uom {
  uuid: ID
  name: String
  description: String
  insertedAt: DateTime
  updatedAt: DateTime
}

type StockUom {
  uuid: ID
  uomName: String
  conversionFactor: Int
  sequence: Int
  item: Item
}

type SupplierPrice {
  uuid: ID
  itemUuid: ID
  supplierUuid: ID
  supplierName: String
  unitPrice: Decimal
  updatedAt: DateTime
}

type Item {
  uuid: ID
  name: String
  "raw_material (RM), manufactured_part (MP) or finished_good (FG)."
  itemType: String
  standardCost: Decimal
  "onHandQty valued at standardCost."
  stockValue: Decimal
  supplierPrices: [SupplierPrice]
  spec: String
  description: String
  sellingPrice: Decimal
  defaultStockUomUuid: ID
  defaultStockUomName: String
  sku: String
  category: String
  minStockThreshold: Decimal
  "Across all warehouses, in the default stock UOM."
  onHandQty: Decimal
  "Committed to open orders, in the default stock UOM."
  reservedQty: Decimal
  "onHandQty minus reservedQty."
  availableQty: Decimal
  stockUoms: [StockUom]
  stockItems: [StockItem]
  bom: Bom
  insertedAt: DateTime
  updatedAt: DateTime
}

type StockItem {
  uuid: ID
  totalOnHand: Decimal
  item: Item
  stockUom: StockUom
  warehouse: Warehouse
  insertedAt: DateTime
  updatedAt: DateTime
}

type Warehouse {
  uuid: ID
  name: String
  address: String
  area: String
  contactName: String
  contactEmail: String
  isDefault: Boolean
  insertedAt: DateTime
  updatedAt: DateTime
}

type Customer {
  uuid: ID
  name: String
  customerType: String

  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  contactName: String

  phone: String
  alternatePhone: String
  landline: String
  email: String

  messengerId: String
  facebook: String
  viber: String
  whatsapp: String
  telegram: String
  instagram: String
  tiktok: String
  marketplaceAccount: String

  address: String
  barangay: String
  city: String
  province: String
  region: String
  postalCode: String

  sourcePlatform: String
  primaryChannel: String
  followUpStatus: String
  notes: String
  "Standing build specifications: bike model, finish, fitment."
  buildSpecs: String

  balance: Decimal
  insertedAt: DateTime
  updatedAt: DateTime
}

type Supplier {
  uuid: ID
  name: String
  address: String
  tin: String
  contactFirstName: String
  contactLastName: String
  contactPosition: String
  contactName: String
  phone: String
  landline: String
  email: String
  notes: String
  insertedAt: DateTime
  updatedAt: DateTime
}

type Process {
  uuid: ID
  name: String
  code: String
  description: String
  insertedAt: DateTime
  updatedAt: DateTime
}

type Workstation {
  uuid: ID
  name: String
  code: String
  location: String
  description: String
  capacityHours: Decimal
  isActive: Boolean
  adminUuid: String
  members: [Staff]
  insertedAt: DateTime
  updatedAt: DateTime
}

type PaymentMethod {
  uuid: ID
  name: String
  kind: String
  provider: String
  accountName: String
  accountNumber: String
  currency: String
  requiresReference: Boolean
  isActive: Boolean
  notes: String
  insertedAt: DateTime
  updatedAt: DateTime
}

type BomLevel {
  level: Int
  itemName: String
  itemType: String
  qty: Decimal
  bomCode: String
}

type Bom {
  uuid: ID
  code: String
  name: String
  "The assembly flattened by level; level 0 is the finished part."
  levels: [BomLevel]
  itemName: String
  item: Item
  bomItems: [BomItem]
  bomProcesses: [BomProcess]
  insertedAt: DateTime
  updatedAt: DateTime
}

type BomItem {
  uuid: ID
  itemName: String
  uomName: String
  qty: Decimal
  stockUomUuid: ID
  stockUom: StockUom
  item: Item
  bom: Bom
  insertedAt: DateTime
  updatedAt: DateTime
}

type BomProcess {
  uuid: ID
  position: Int
  processName: String
  toolRequired: String
  process: Process
  bom: Bom
}

type SalesOrder {
  uuid: ID
  code: String
  status: String
  billingStatus: String
  deliveryStatus: String
  customerUuid: ID
  customerName: String
  customer: Customer
  warehouseUuid: ID
  warehouseName: String
  warehouse: Warehouse
  totalAmount: Decimal
  paidAmount: Decimal
  remainingAmount: Decimal
  totalQty: Decimal
  deliveredQty: Decimal
  remainingQty: Decimal
  requiredDate: DateTime
  notes: String
  "overdue, at_risk, on_track, or null."
  deliveryRisk: String
  salesInvoiceCode: String
  workOrders: [WorkOrder]
  workOrderSuggestions: [WorkOrderSuggestion]
  items: [SalesOrderItem]
  deliveryNotes: [DeliveryNote]
  salesInvoices: [SalesInvoice]
  insertedAt: DateTime
  updatedAt: DateTime
}

type WorkOrderSuggestion {
  salesOrderItemUuid: ID
  itemUuid: ID
  itemName: String
  bomUuid: ID
  bomName: String
  availableQty: Decimal
  suggestedQty: Decimal
  reason: String
}

type SalesOrderItem {
  uuid: ID
  customSpec: String
  itemUuid: ID
  itemName: String
  item: Item
  uomName: String
  stockUomUuid: ID
  unitPrice: Decimal
  orderedQty: Decimal
  deliveredQty: Decimal
  remainingQty: Decimal
  "Quantity already on sales invoices."
  invoicedQty: Decimal
  "orderedQty minus invoicedQty."
  uninvoicedQty: Decimal
  amount: Decimal
  salesOrder: SalesOrder
  insertedAt: DateTime
  updatedAt: DateTime
}

type DeliveryNote {
  uuid: ID
  code: String
  status: String
  customerName: String
  customer: Customer
  salesOrderUuid: ID
  salesOrder: SalesOrder
  warehouse: Warehouse
  totalAmount: Decimal
  totalQty: Decimal
  items: [DeliveryNoteItem]
  insertedAt: DateTime
  updatedAt: DateTime
}

type DeliveryNoteItem {
  uuid: ID
  itemName: String
  item: Item
  actualQty: Decimal
  unitPrice: Decimal
  amount: Decimal
  uomName: String
  stockUomUuid: ID
  deliveryNote: DeliveryNote
  salesOrder: SalesOrder
  salesOrderItem: SalesOrderItem
  insertedAt: DateTime
  updatedAt: DateTime
}

type SalesInvoiceItem {
  uuid: ID
  salesOrderItemUuid: ID
  itemUuid: ID
  itemName: String
  description: String
  uomName: String
  qty: Decimal
  unitPrice: Decimal
  discount: Decimal
  lineTotal: Decimal
}

type SalesInvoice {
  uuid: ID
  code: String
  status: String
  "Grand total payable, VAT included."
  amount: Decimal
  paidAmount: Decimal
  "amount minus paidAmount."
  balance: Decimal
  customerUuid: ID
  customerName: String
  customer: Customer
  salesOrderUuid: ID
  salesOrder: SalesOrder
  salesOrderCode: String
  invoiceDate: DateTime
  dueDate: DateTime
  paymentTerms: String
  customerAddress: String
  customerTin: String
  customerReference: String
  vatMode: String
  subtotal: Decimal
  discountAmount: Decimal
  vatableAmount: Decimal
  vatAmount: Decimal
  notes: String
  "Official Receipt number, set when payment is confirmed."
  orNumber: String
  paymentMethodUuid: ID
  paymentMethodName: String
  paidAt: DateTime
  items: [SalesInvoiceItem]
  insertedAt: DateTime
  updatedAt: DateTime
}

type PurchaseOrder {
  uuid: ID
  code: String
  status: String
  receiptStatus: String
  billingStatus: String
  supplierUuid: ID
  supplierName: String
  supplierAddress: String
  supplier: Supplier
  warehouseUuid: ID
  warehouseName: String
  warehouse: Warehouse
  totalAmount: Decimal
  paidAmount: Decimal
  remainingAmount: Decimal
  totalQty: Decimal
  receivedQty: Decimal
  remainingQty: Decimal
  expectedDate: DateTime
  items: [PurchaseOrderItem]
  purchaseInvoices: [PurchaseInvoice]
  receiptNotes: [ReceiptNote]
  insertedAt: DateTime
  updatedAt: DateTime
}

type PurchaseOrderItem {
  uuid: ID
  itemName: String
  purchaseRequestItemUuid: ID
  uomName: String
  stockUomUuid: ID
  unitPrice: Decimal
  orderedQty: Decimal
  receivedQty: Decimal
  remainingQty: Decimal
  amount: Decimal
  insertedAt: DateTime
  updatedAt: DateTime
}

type ReceiptNote {
  uuid: ID
  code: String
  status: String
  supplierName: String
  purchaseOrderUuid: ID
  purchaseOrderCode: String
  purchaseInvoiceCode: String
  warehouse: Warehouse
  totalAmount: Decimal
  totalQty: Decimal
  items: [ReceiptNoteItem]
  insertedAt: DateTime
  updatedAt: DateTime
}

type ReceiptNoteItem {
  uuid: ID
  itemName: String
  uomName: String
  stockUomUuid: ID
  unitPrice: Decimal
  actualQty: Decimal
  amount: Decimal
  insertedAt: DateTime
  updatedAt: DateTime
}

type PurchaseInvoice {
  uuid: ID
  code: String
  status: String
  amount: Decimal
  paidAmount: Decimal
  balance: Decimal
  receiptNoteUuid: ID
  receiptNoteCode: String
  purchaseOrderCode: String
  referenceNo: String
  paymentMethodName: String
  paidAt: DateTime
  supplierUuid: ID
  supplierName: String
  supplier: Supplier
  purchaseOrderUuid: ID
  purchaseOrder: PurchaseOrder
  insertedAt: DateTime
  updatedAt: DateTime
}

type WorkOrder {
  uuid: ID
  code: String
  title: String
  type: String
  status: String
  startTime: DateTime
  endTime: DateTime
  plannedQty: Decimal
  storedQty: Decimal
  producedQty: Decimal
  scrapedQty: Decimal
  itemUuid: ID
  itemName: String
  item: Item
  uomName: String
  stockUomUuid: ID
  bomUuid: ID
  bom: Bom
  supplierUuid: ID
  supplierName: String
  salesOrderUuid: ID
  salesOrderCode: String
  dueDate: DateTime
  assignedStaffUuid: ID
  assignedStaffName: String
  pieceRate: Decimal
  "Lathe / CNC hours reported on this work order."
  machineHours: Decimal
  "Labour hours from reported start and end times."
  laborHours: Float
  warehouse: Warehouse
  items: [WorkOrderItem]
  materialRequests: [WorkOrderMaterialRequest]
  "Production board stage: queued, assigned, in_progress, quality_check, final_check, completed."
  stage: String
  stageChangedAt: DateTime
  "Pieces the worker reported; can exceed plannedQty."
  reportedQty: Decimal
  "Pieces that passed quality check."
  goodQty: Decimal
  rejectedQty: Decimal
  insertedAt: DateTime
  updatedAt: DateTime
}

type WorkOrderItem {
  uuid: ID
  workOrderUuid: ID
  workOrder: WorkOrder
  itemName: String
  processName: String
  position: Int
  requiredQty: Decimal
  defectiveQty: Decimal
  producedQty: Decimal
  jobCards: [JobCard]
  insertedAt: DateTime
  updatedAt: DateTime
}

type WorkOrderMaterialRequest {
  uuid: ID
  itemName: String
  itemUuid: ID
  item: Item
  actualQty: Decimal
  remainingQty: Decimal
  receivedQty: Decimal
  uomName: String
  stockUomUuid: ID
  stockUom: StockUom
  bomUuid: ID
  warehouseUuid: ID
  warehouse: Warehouse
  workOrderUuid: ID
  workOrder: WorkOrder
  insertedAt: DateTime
  updatedAt: DateTime
}

type JobCard {
  uuid: ID
  startTime: DateTime
  endTime: DateTime
  status: String
  defectiveQty: Decimal
  producedQty: Decimal
  machineHours: Decimal
  laborHours: Float
  operatorStaffUuid: ID
  operatorStaff: Staff
  workOrderItemUuid: ID
  workOrderItem: WorkOrderItem
  workOrderUuid: ID
  workOrder: WorkOrder
  insertedAt: DateTime
  updatedAt: DateTime
}

type InventoryEntry {
  uuid: ID
  code: String
  type: String
  actualQty: Decimal
  qtyAfterTransaction: Decimal
  threadType: String
  threadUuid: ID
  item: Item
  warehouse: Warehouse
  stockUomUuid: ID
  stockUom: StockUom
  insertedAt: DateTime
  updatedAt: DateTime
}

type PaymentEntry {
  uuid: ID
  code: String
  type: String
  partyName: String
  partyType: String
  partyUuid: ID
  paymentMethodUuid: ID
  paymentMethod: PaymentMethod
  totalAmount: Decimal
  referenceNo: String
  paidOn: DateTime
  memo: String
  attachments: [String]
  purchaseInvoiceIds: [String]
  salesInvoiceIds: [String]
  insertedAt: DateTime
  updatedAt: DateTime
}

type PurchaseRequest {
  uuid: ID
  code: String
  "pending, approved, partly_ordered, ordered or rejected."
  status: String
  requestedBy: String
  requiredDate: DateTime
  notes: String
  approvedAt: DateTime
  purchaseOrderCodes: [String]
  items: [PurchaseRequestItem]
  insertedAt: DateTime
}

type PurchaseRequestItem {
  uuid: ID
  purchaseRequestUuid: ID
  purchaseRequestCode: String
  itemUuid: ID
  itemName: String
  uomName: String
  stockUomUuid: ID
  requestedQty: Decimal
  orderedQty: Decimal
  remainingQty: Decimal
  estimatedUnitPrice: Decimal
}

type ManufacturedGood {
  uuid: ID
  itemName: String
  qty: Decimal
  workOrderCode: String
  storedAt: DateTime
}

type JournalLine {
  uuid: ID
  account: String
  debit: Decimal
  credit: Decimal
}

type JournalEntry {
  uuid: ID
  entryDate: DateTime
  description: String
  sourceType: String
  sourceUuid: ID
  sourceCode: String
  lines: [JournalLine]
}

type AccountBalance {
  account: String
  debit: Decimal
  credit: Decimal
  "Debits minus credits."
  balance: Decimal
}

type AttendanceRecord {
  uuid: ID
  staffUuid: ID
  staffName: String
  workDate: DateTime
  timeIn: DateTime
  timeOut: DateTime
  "present, late, absent or on_leave."
  status: String
  regularHours: Decimal
  overtimeHours: Decimal
  notes: String
}

type Benefits {
  overtimeMultiplier: Float
  defaultPieceRate: Float
  sssRate: Float
  philhealthRate: Float
  pagibigRate: Float
  withholdingTaxRate: Float
  standardHoursPerDay: Float
}

type PayrollEntry {
  uuid: ID
  staffUuid: ID
  staffName: String
  periodName: String
  employmentType: String
  hourlyRate: Decimal
  daysPresent: Int
  regularHours: Decimal
  overtimeHours: Decimal
  unitsProduced: Decimal
  basePay: Decimal
  overtimePay: Decimal
  incentivePay: Decimal
  grossPay: Decimal
  sssDeduction: Decimal
  philhealthDeduction: Decimal
  pagibigDeduction: Decimal
  taxDeduction: Decimal
  netPay: Decimal
  insertedAt: DateTime
}

type PayrollPeriod {
  uuid: ID
  name: String
  startDate: DateTime
  endDate: DateTime
  payDate: DateTime
  "draft or finalized."
  status: String
  totalNetPay: Decimal
  entries: [PayrollEntry]
}

type RolePermission {
  role: String
  modules: [String]
}

type ModuleOption {
  key: String
  label: String
}

type InvoiceRef {
  uuid: ID
  code: String
}

input IdRequest { uuid: ID }
input DateRequest { date: String }
input PurchaseRequestItemArg { itemUuid: ID, requestedQty: Float, stockUomUuid: ID, uomName: String }
input CreatePurchaseRequestRequest {
  requestedBy: String
  requiredDate: DateTime
  notes: String
  items: [PurchaseRequestItemArg]
}
input ReviewPurchaseRequestRequest { uuid: ID!, approve: Boolean! }
input RecordInvoicePaymentRequest {
  "sales or purchase."
  invoiceType: String!
  invoiceUuid: ID!
  amount: Float!
  paymentMethodUuid: ID!
  "Official Receipt number; required for sales invoices."
  orNumber: String
  "Transfer reference, check number or wallet id; required when the method asks for one."
  referenceNo: String
  "Date the money was paid; defaults to today."
  paidOn: DateTime
}
input SaveAttendanceRequest {
  staffUuid: ID!
  workDate: String
  timeIn: DateTime
  timeOut: DateTime
  status: String
  notes: String
}
input BenefitsRequest {
  overtimeMultiplier: Float
  defaultPieceRate: Float
  sssRate: Float
  philhealthRate: Float
  pagibigRate: Float
  withholdingTaxRate: Float
  standardHoursPerDay: Float
}
input GeneratePayrollRequest { uuid: ID, name: String, startDate: String!, endDate: String!, payDate: String }
input RolePermissionRequest { role: String!, modules: [String]! }
input UserRoleRequest { staffUuid: ID!, role: String! }
input LoginRequest { email: String, password: String }
input CreateCustomerRequest {
  """Optional: derived from the name parts when omitted."""
