"the root of query."
type Configuration {
  currency: String
  timezone: String
  decimalPlaces: Int
  "manager: a manager assigns production tasks. self: workers claim them."
  productionClaimMode: String
}

input UpdateConfigurationRequest {
  currency: String
  timezone: String
  decimalPlaces: Int
  productionClaimMode: String
}

type ProductionBoard {
  claimMode: String
  "Whether the signed-in account may pass checks and complete tasks."
  canSupervise: Boolean
  tasks: [WorkOrder]
}

type WorkOrderStageLog {
  uuid: ID
  fromStage: String
  toStage: String
  staffName: String
  movedBy: String
  reportedQty: Decimal
  goodQty: Decimal
  rejectedQty: Decimal
  note: String
  insertedAt: DateTime
}

input MoveWorkOrderStageRequest {
  uuid: ID!
  toStage: String!
  "Who the task goes to, when assigning or claiming."
  staffUuid: ID
  "Pieces made, when sending to quality check."
  reportedQty: Float
  "Pieces that passed, when passing quality check."
  goodQty: Float
  note: String
}

type RootQueryType {
  configuration: Configuration
  company: Company
  currentUser: User
  listStaff: [Staff]

  item(request: IdRequest!): Item
  items: [Item]
  uoms: [Uom]
  warehouses: [Warehouse]
  stockItems: [StockItem]
  inventoryEntries: [InventoryEntry]

  customer(request: IdRequest!): Customer
