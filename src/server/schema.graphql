  customerType: String

  firstName: String
  middleName: String
  lastName: String
  suffix: String
  companyName: String
  contactName: String

  phone: String
  alternatePhone: String
  landline: String
  email: String

  messengerId: String
  facebook: String
  viber: String
  whatsapp: String
  telegram: String
  instagram: String
  tiktok: String
  marketplaceAccount: String

  address: String
  barangay: String
  city: String
  province: String
  region: String
  postalCode: String

  sourcePlatform: String
  primaryChannel: String
  notes: String
  buildSpecs: String
}
input CreateSupplierRequest {
  name: String!
  address: String!
  tin: String
  contactFirstName: String!
  contactLastName: String!
  contactPosition: String
  phone: String
  landline: String
  email: String
  notes: String
}
input CreateProcessRequest { name: String, code: String, description: String }
input CreateWorkstationRequest {
  uuid: ID
  name: String
  code: String
  location: String
  description: String
