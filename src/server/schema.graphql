input CreatePaymentMethodRequest {
  uuid: ID
  name: String
  kind: String
  provider: String
  accountName: String
  accountNumber: String
  currency: String
  requiresReference: Boolean
  isActive: Boolean
  notes: String
}

input StockUomArg { uomUuid: ID, conversionFactor: Int, sequence: Int }
input OpeningStockArg { warehouseUuid: ID, qty: Float }
input CreateItemRequest {
  name: String!
  itemType: String
  sku: String
  category: String
  standardCost: Float
  minStockThreshold: Float
  spec: String
  description: String
  sellingPrice: Decimal!
  stockUoms: [StockUomArg]!
  openingStocks: [OpeningStockArg]
